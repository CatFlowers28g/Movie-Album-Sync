# Builds the Windows installer and portable zip.
# - Run it by hand from the Actions tab ("Run workflow"), and download the files from the run's Artifacts.
# - Or push a version tag (e.g. git tag v1.0.0 && git push origin v1.0.0) to also attach them to a GitHub Release.
name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build
        shell: pwsh
        run: ./desktop-app/build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: MovieAlbumSync-Windows
          path: desktop-app/dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop-app/dist/*
