# Builds the Windows installer and the Mac disk images (Apple Silicon and Intel).
# - Runs on every push that changes the app, so a broken build shows up right away.
#   Download the files from the run's Artifacts section.
# - Push a version tag (e.g. git tag v1.2.0 && git push origin v1.2.0) to also publish a GitHub Release.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["desktop-app/**", ".github/workflows/build.yml"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build
        shell: pwsh
        run: ./desktop-app/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MovieAlbumSync-Windows
          path: desktop-app/dist/*

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon
            chip: AppleSilicon
          - runner: macos-15-intel    # Intel
            chip: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build
        run: bash desktop-app/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MovieAlbumSync-Mac-${{ matrix.chip }}
          path: desktop-app/dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: downloads/*
